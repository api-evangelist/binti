aid: binti
name: Binti
description: >-
  Binti builds cloud-based, mobile-friendly software for child welfare and foster care agencies, offered as a
  modular Comprehensive Child Welfare Information System (CCWIS) covering licensing, placements, case management,
  intake, investigations, eligibility, payments, and family finding & engagement. Since 2017 it has scaled to
  serve over 450 government agencies across 34 states and Washington, DC, including statewide implementations,
  and supports roughly half of the nation's child welfare system. Binti exposes a private, bi-directional
  integration API so agencies can connect its modules to their existing systems of record; the platform is
  HIPAA-compliant with a Vanta-hosted Trust Center. Binti is headquartered in Oakland, California and is a
  portfolio company of Cowboy Ventures. This profile was enriched by the API Evangelist pipeline.
